# Serves the docs site from the Docker `web` stage. Unknown paths fall back to
# index.html so deep links like /components/badge work (same as vercel.json).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
